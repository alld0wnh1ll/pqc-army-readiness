<line x1="288.0" y1="593.9259160753938" x2="288.0" y2="569.9259160753938" stroke="#e8716b" stroke-opacity="0.5"/>
<circle cx="288.0" cy="593.9259160753938" r="6" fill="#e8716b" stroke="#121a17" stroke-width="2"/>
<text x="288.0" y="545.9259160753938" text-anchor="middle" fill="#f0918b" font-size="13.5" font-weight="600">Issues unknown</text>
<text x="288.0" y="562.9259160753938" text-anchor="middle" fill="#9fb0aa" font-size="11.5">Seem inexpensive here</text>
<line x1="466.0" y1="566.2265990460759" x2="466.0" y2="527.2265990460759" stroke="#e8716b" stroke-opacity="0.5"/>
<circle cx="466.0" cy="566.2265990460759" r="6" fill="#e8716b" stroke="#121a17" stroke-width="2"/>
<text x="466.0" y="488.2265990460759" text-anchor="middle" fill="#f0918b" font-size="13.5" font-weight="600">Issues discovered late</text>
<text x="466.0" y="505.2265990460759" text-anchor="middle" fill="#9fb0aa" font-size="11.5">Design changes, retesting, and</text>
<text x="466.0" y="520.2265990460759" text-anchor="middle" fill="#9fb0aa" font-size="11.5">integration across systems</text>
<line x1="822.0" y1="433.7734009539241" x2="822.0" y2="392.7734009539241" stroke="#e8716b" stroke-opacity="0.5"/>
<circle cx="822.0" cy="433.7734009539241" r="6" fill="#e8716b" stroke="#121a17" stroke-width="2"/>
<text x="822.0" y="353.7734009539241" text-anchor="middle" fill="#f0918b" font-size="13.5" font-weight="600">Fielded system changes</text>
<text x="822.0" y="370.7734009539241" text-anchor="middle" fill="#9fb0aa" font-size="11.5">Extensive rework, operational</text>
<text x="822.0" y="385.7734009539241" text-anchor="middle" fill="#9fb0aa" font-size="11.5">impact, increased risk</text>
<circle cx="950" cy="361.92002443863635" r="6" fill="#e8716b" stroke="#121a17" stroke-width="2"/>
<text x="964" y="387.92002443863635" text-anchor="start" fill="#f0918b" font-size="13.5" font-weight="600">Delayed discovery</text>
<text x="964" y="404.92002443863635" text-anchor="start" fill="#9fb0aa" font-size="11.5">Increasingly expensive</text>
<text x="964" y="419.92002443863635" text-anchor="start" fill="#9fb0aa" font-size="11.5">as systems mature</text>
<line x1="288.0" y1="601.2900629347613" x2="288.0" y2="618.2900629347613" stroke="#5fd0b0" stroke-opacity="0.5"/>
<circle cx="288.0" cy="601.2900629347613" r="6" fill="#5fd0b0" stroke="#121a17" stroke-width="2"/>
<text x="288.0" y="633.2900629347613" text-anchor="middle" fill="#5fd0b0" font-size="13.5" font-weight="600">Early discovery</text>
<text x="288.0" y="650.2900629347613" text-anchor="middle" fill="#9fb0aa" font-size="11.5">Address issues before they</text>
<text x="288.0" y="665.2900629347613" text-anchor="middle" fill="#9fb0aa" font-size="11.5">become embedded design decisions</text>
<line x1="644.0" y1="576.8867004769621" x2="644.0" y2="595.8867004769621" stroke="#5fd0b0" stroke-opacity="0.5"/>
<circle cx="644.0" cy="576.8867004769621" r="6" fill="#5fd0b0" stroke="#121a17" stroke-width="2"/>
<text x="644.0" y="610.8867004769621" text-anchor="middle" fill="#5fd0b0" font-size="13.5" font-weight="600">Informed implementation</text>
<text x="644.0" y="627.8867004769621" text-anchor="middle" fill="#9fb0aa" font-size="11.5">Fewer surprises, less rework</text>
<circle cx="950" cy="546.2238043721509" r="6" fill="#5fd0b0" stroke="#121a17" stroke-width="2"/>
<text x="964" y="574.2238043721509" text-anchor="start" fill="#5fd0b0" font-size="13.5" font-weight="600">Early discovery</text>
<text x="964" y="591.2238043721509" text-anchor="start" fill="#9fb0aa" font-size="11.5">Lower risk, more</text>
<text x="964" y="606.2238043721509" text-anchor="start" fill="#9fb0aa" font-size="11.5">manageable changes</text>
<g transform="translate(110,804)">
<line x1="0" x2="36" y1="0" y2="0" stroke="#5fd0b0" stroke-width="3"/><circle cx="18" cy="0" r="4.5" fill="#5fd0b0"/>
<text x="48" y="5" fill="#5fd0b0" font-size="14" font-weight="600">Early discovery path</text>
<text x="226" y="5" fill="#9fb0aa" font-size="12.5">Requirements and dependencies resolved while changes are inexpensive</text>
<line x1="0" x2="36" y1="26" y2="26" stroke="#e8716b" stroke-width="3"/><circle cx="18" cy="26" r="4.5" fill="#e8716b"/>
<text x="48" y="31" fill="#f0918b" font-size="14" font-weight="600">Delayed discovery path</text>
<text x="226" y="31" fill="#9fb0aa" font-size="12.5">Same issues surface later, when changes cost significantly more</text>
</g>
